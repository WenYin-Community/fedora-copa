name: Publish to Copr

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  trigger-copr:
    name: Publish to Copr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload release tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '__version__' copa/__init__.py | sed 's/.*"\(.*\)"/\1/')
          TARBALL="fedora-copa-${VERSION}.tar.gz"
          TAG="${{ github.ref_name }}"

          # Create tarball
          cd /tmp
          cp -r "$GITHUB_WORKSPACE" "fedora-copa-${VERSION}"
          tar czf "$GITHUB_WORKSPACE/${TARBALL}" "fedora-copa-${VERSION}"
          rm -rf "fedora-copa-${VERSION}"
          cd "$GITHUB_WORKSPACE"

          # Upload to release (create release if needed)
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            "${TARBALL}" 2>/dev/null || \
          gh release upload "${TAG}" "${TARBALL}" --clobber

      - name: Install copr-cli
        run: pip install copr-cli

      - name: Configure copr-cli credentials
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          mkdir -p ~/.config
          printf '[copr-cli]\nlogin = %s\nusername = ruojiner\ntoken = %s\ncopr_url = https://copr.fedorainfracloud.org\n' "$COPR_LOGIN" "$COPR_TOKEN" > ~/.config/copr

      - name: Trigger Copr build
        run: copr-cli build-package ruojiner/fedora-copa --name fedora-copa --nowait
