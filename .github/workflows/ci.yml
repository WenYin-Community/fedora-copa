name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-versions:
    name: Check version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version sync across pyproject.toml, copa/__init__.py and rpm/copa.spec
        run: |
          INIT=$(grep '__version__' copa/__init__.py | sed 's/.*"\(.*\)"/\1/')
          SPEC=$(grep '^Version:' rpm/copa.spec | awk '{print $2}')
          TOML=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "copa/__init__.py: $INIT"
          echo "rpm/copa.spec: $SPEC"
          echo "pyproject.toml: $TOML"
          [ "$INIT" = "$SPEC" ] && [ "$INIT" = "$TOML" ] \
            || { echo "::error::Version mismatch between the three files"; exit 1; }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [check-versions]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint dependencies
        run: |
          pip install ruff mypy

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy copa/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [check-versions]
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  build-rpm:
    name: Build RPM (Fedora ${{ matrix.fedora_version }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        fedora_version: ['43', '44']
    container:
      image: fedora:${{ matrix.fedora_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            rpmdevtools \
            python3-devel \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-copr \
            python3-httpx \
            python3-pytest \
            tar

      - name: Create source archive
        run: |
          VERSION=$(grep '__version__' copa/__init__.py | sed 's/.*"\(.*\)"/\1/')
          git archive --format=tar.gz --prefix=fedora-copa-${VERSION}/ \
            -o $GITHUB_WORKSPACE/fedora-copa-${VERSION}.tar.gz HEAD

      - name: Build RPM
        run: |
          mkdir -p build/RPMS build/SRPMS
          rpmbuild -bb rpm/copa.spec \
            --define "_topdir $(pwd)/build" \
            --define "_sourcedir $(pwd)" \
            --target noarch

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: copa-rpm-fc${{ matrix.fedora_version }}
          path: build/RPMS/noarch/*.rpm

  build-srpm:
    name: Build SRPM
    runs-on: ubuntu-latest
    needs: [lint, test]
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            rpmdevtools \
            python3-devel \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-copr \
            python3-httpx \
            python3-pytest \
            tar

      - name: Create source archive
        run: |
          VERSION=$(grep '__version__' copa/__init__.py | sed 's/.*"\(.*\)"/\1/')
          git archive --format=tar.gz --prefix=fedora-copa-${VERSION}/ \
            -o $GITHUB_WORKSPACE/fedora-copa-${VERSION}.tar.gz HEAD

      - name: Build SRPM
        run: |
          mkdir -p build/SRPMS
          rpmbuild -bs rpm/copa.spec \
            --define "_topdir $(pwd)/build" \
            --define "_sourcedir $(pwd)"

      - name: Upload SRPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: copa-srpm
          path: build/SRPMS/*.src.rpm

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-rpm, build-srpm]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: rpms/
          pattern: copa-rpm-*

      - name: Download SRPM artifact
        uses: actions/download-artifact@v4
        with:
          name: copa-srpm
          path: srpm/

      - name: Create source archive
        run: |
          VERSION=$(grep '__version__' copa/__init__.py | sed 's/.*"\(.*\)"/\1/')
          git archive --format=tar.gz --prefix=fedora-copa-${VERSION}/ \
            -o $GITHUB_WORKSPACE/fedora-copa-${VERSION}.tar.gz HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fedora-copa-*.tar.gz
            rpms/**/*.rpm
            srpm/*.src.rpm
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-copr:
    name: Publish to Copr
    runs-on: ubuntu-latest
    needs: [create-release]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install copr-cli
        run: pip install copr-cli

      - name: Configure copr-cli credentials
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          mkdir -p ~/.config
          printf '[copr-cli]\nlogin = %s\nusername = ruojiner\ntoken = %s\ncopr_url = https://copr.fedorainfracloud.org\n' "$COPR_LOGIN" "$COPR_TOKEN" > ~/.config/copr

      - name: Trigger Copr build
        run: copr-cli build-package ruojiner/fedora-copa --name fedora-copa --nowait
